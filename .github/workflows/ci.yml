# The gate in CONTRIBUTING.md § 4, run by a machine. Not a replacement for
# § 5 — saving every editor tab and looking at a real calendar are checks no
# runner can make.
name: Gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-24.04

    # MySQL here too, the same as development, tests and production. A
    # different engine in CI would hide exactly the differences that matter:
    # strict mode, foreign-key indexing, date functions, JSON handling.
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          # phpunit.xml pins the name; the host and credentials come from the
          # environment, which is what these two lines are.
          MYSQL_DATABASE: my_page_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: root

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, bcmath, gd, intl
          coverage: none

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Prepare the environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # The five gate commands. --test rather than a rewrite: CI reports
      # style, it does not fix it.
      - name: Style
        run: vendor/bin/pint --test

      - name: Static analysis
        run: composer analyse

      # Before the PHP tests, not after them as CONTRIBUTING.md lists it: the
      # suite renders the Blade shell, which resolves the Vite manifest, and
      # public/build is not in the repository. On a working machine it is
      # already there, so only a clean checkout ever notices.
      - name: Build
        run: npm run build

      - name: PHP tests
        run: composer test 2>&1 | tee /tmp/php-tests.log

      # Downloading a job log needs a token; a job summary does not. So a red
      # gate says what failed on its own page, and through the public API.
      - name: What failed
        if: failure()
        run: |
          {
            echo '### PHP test failures'
            echo '```'
            grep -E '(FAILED|FAIL |Tests:)' /tmp/php-tests.log | head -60 || true
            echo '```'
            echo '<details><summary>Last 150 lines</summary>'
            echo '```'
            tail -150 /tmp/php-tests.log
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Frontend tests
        run: npm test
